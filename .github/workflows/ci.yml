name: deterministic-harness-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: rag-harness validate-config rag_harness.yaml
      - name: Exercise installed CLI end to end
        run: |
          rag-harness evaluate --gold tests/fixtures/gold.jsonl --run tests/fixtures/run.jsonl --config rag_harness.yaml --out "$RUNNER_TEMP/e2e"
          rag-harness gate --metrics "$RUNNER_TEMP/e2e/metrics.json" --config rag_harness.yaml --out "$RUNNER_TEMP/e2e/gate.json"
          python -c 'import json,os; p=os.path.join(os.environ["RUNNER_TEMP"],"e2e","gate.json"); assert json.load(open(p))["verdict"] == "PASS"'
