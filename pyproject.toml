[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-engineering-harness"
version = "0.3.0"
description = "Deterministic-first evaluation and release gating for RAG systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Raul Flores Cartes"}]
dependencies = []

[project.scripts]
rag-harness = "rag_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
